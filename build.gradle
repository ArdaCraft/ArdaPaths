plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
    id "checkstyle"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
    maven { url = "https://cursemaven.com/" }
}

dependencies {

    // Lombok - Compile only
    compileOnly("org.projectlombok:lombok:${project.lombok_version}")
    annotationProcessor("org.projectlombok:lombok:${project.lombok_version}")

    // Lombok - Compile only
    testCompileOnly("org.projectlombok:lombok:${project.lombok_version}")
    testAnnotationProcessor("org.projectlombok:lombok:${project.lombok_version}")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'com.google.code.gson:gson:2.12.1'

    // Permissions API is bundled so permission checks work without forcing LuckPerms.
    // Non-transitive: its POM imports the fabric-api BOM for 1.20.4, which would drag a
    // 1.20.4 Fabric API onto the run classpath and fail dependency resolution on 1.20.1.
    // The nested jar only needs fabric-api-base, which the 1.20.1 Fabric API already provides.
    include(modImplementation("me.lucko:fabric-permissions-api:0.3.1") {
        transitive = false
    })

    // Optional integrations - compile against them, never require them at runtime.
    modCompileOnly("maven.modrinth:ardaregions:${project.ardaregions_version}")
    modCompileOnly("maven.modrinth:ardamaps:${project.ardamaps_version}")
    modCompileOnly("curse.maven:huskhomes-849217:5468607")

    modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:${devauth_version}")

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}

test {
    useJUnitPlatform()
}

loom {
    accessWidenerPath = file("src/main/resources/arda-path.accesswidener")

    runs {
        client {
            property("devauth.configDir", getRootProject().file(".devauth").absolutePath)
            runDir = "run"
            client()
        }

        server {
            runDir = "runServer"
            server()
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_dependency", ">=${project.minecraft_version}"
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "minecraft_dependency": ">=${project.minecraft_version}"
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

checkstyle {
    toolVersion = "10.21.4"
    configDirectory = layout.projectDirectory.dir("config/checkstyle")
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register("javadocLint") {
    group = "verification"
    description = "Checks main Java sources for missing Javadoc using Checkstyle."
    dependsOn tasks.named("checkstyleMain")
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {}
}
